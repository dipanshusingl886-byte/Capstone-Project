
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef4ff;
        }

        .container {
            width: 900px;
            min-height: 560px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .left {
            width: 50%;
            padding: 50px;
            color: white;
            background:
                linear-gradient(rgba(20,65,130,.7),rgba(20,65,130,.7)),
                url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=900&q=80");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 120px;
        }

        .logo span {
            color: #8ec5ff;
        }

        .left h1 {
            font-size: 38px;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .left p {
            line-height: 1.6;
            opacity: .9;
        }

        .right {
            width: 50%;
            padding: 55px 50px;
        }

        .right h2 {
            font-size: 30px;
            color: #172b4d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #2878ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg,#2878ff,#1554c0);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .otp-box {
            display: none;
        }

        .otp-input {
            text-align: center;
            font-size: 25px;
            letter-spacing: 8px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2878ff;
            cursor: pointer;
        }

        .message {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        @media(max-width:750px) {
            .container {
                width: 95%;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">

        <div class="logo">
            🏠 Rent<span>Ease</span>
        </div>

        <h1>
            Find a place you'll love to call home.
        </h1>

        <p>
            Manage your rental properties, tenants and payments
            easily with RentEase.
        </p>

    </div>


    <div class="right">

        <!-- LOGIN -->
        <div id="loginBox">

            <h2>Welcome Back 👋</h2>

            <p class="subtitle">
                Login to continue to RentEase
            </p>

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <div id="loginMessage" class="message"></div>

            <button onclick="sendOTP()">
                Login & Send OTP
            </button>

        </div>


        <!-- OTP -->
        <div id="otpBox" class="otp-box">

            <h2>Verify OTP 🔐</h2>

            <p class="subtitle">
                We sent a 6-digit OTP to your email.
            </p>

            <label>Enter OTP</label>

            <input
                type="text"
                id="otp"
                class="otp-input"
                maxlength="6"
                placeholder="000000"
            >

            <div id="otpMessage" class="message"></div>

            <button onclick="verifyOTP()">
                Verify OTP
            </button>

            <span class="back" onclick="goBack()">
                ← Back to Login
            </span>

        </div>


        <!-- SUCCESS -->
        <div id="successBox" class="otp-box">

            <h2>Login Successful 🎉</h2>

            <p class="subtitle">
                Welcome to RentEase!
            </p>

            <button onclick="dashboard()">
                Go to Dashboard
            </button>

        </div>

    </div>

</div>


<script>

let generatedOTP;


/* SEND OTP */

function sendOTP() {

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let message = document.getElementById("loginMessage");

    if (email === "" || password === "") {

        message.className = "message error";
        message.innerText = "Please enter email and password.";

        return;
    }

    /* Demo OTP */

    generatedOTP =
        Math.floor(100000 + Math.random() * 900000);

    console.log("Your Demo OTP is:", generatedOTP);

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("otpBox").style.display = "block";

    alert(
        "OTP: " + generatedOTP 
        
    );
}


/* VERIFY OTP */

function verifyOTP() {

    let otp = document.getElementById("otp").value;
    let message = document.getElementById("otpMessage");

    if (otp == generatedOTP) {

        message.className = "message success";
        message.innerText = "OTP verified successfully!";

        setTimeout(function() {

            document.getElementById("otpBox").style.display = "none";

            document.getElementById("successBox").style.display = "block";

        }, 800);

    } else {

        message.className = "message error";
        message.innerText = "Invalid OTP. Please try again.";

    }
}


/* BACK */

function goBack() {

    document.getElementById("otpBox").style.display = "none";

    document.getElementById("loginBox").style.display = "block";
}


/* DASHBOARD */

function dashboard() {

    alert("RentEase Dashboard Opening...");

}
</script>
</body>
</html>
